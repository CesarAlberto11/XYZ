name: Build XYZ from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q -o ./*.zip -d proj
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Unit tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XYZ-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
